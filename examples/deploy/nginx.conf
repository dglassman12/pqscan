# Test fixture for pqscan.
server {
    listen 443 ssl;
    server_name api.example.test;

    ssl_certificate     certs/api.example.test.crt;
    ssl_protocols       TLSv1 TLSv1.1 TLSv1.2;
    ssl_ciphers         ECDHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-SHA:RC4-SHA;
    ssl_dhparam         /etc/nginx/dhparam.pem;
    # ssl_ecdh_curve    X25519MLKEM768:X25519;   # enable once OpenSSL 3.5 is rolled out
}
