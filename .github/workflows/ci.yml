name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (with the optional schema validator)
        run: python -m pip install ".[test]"
      - name: Unit tests
        run: python -m unittest discover -s tests -t .
      - name: Scan this repository with itself
        run: pqscan . --no-color --fail-on high
